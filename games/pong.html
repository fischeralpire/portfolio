<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 100%;
    padding: 8px;
  }
  h1 {
    font-size: clamp(10px, 2.4vw, 16px);
    letter-spacing: 3px;
    text-shadow: 0 0 8px #fff;
  }
  #score {
    display: flex;
    gap: 40px;
    font-size: clamp(14px, 3vw, 22px);
    text-shadow: 0 0 6px #fff;
  }
  #board-wrap {
    position: relative;
    border: 2px solid #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.25);
    flex: 1;
    min-height: 0;
  }
  canvas {
    display: block;
  }
  /* CRT scanline overlay for that old-TV look */
  #board-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,0.8);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay p { font-size: 10px; line-height: 1.8; color: #ccc; }
  #overlay .big { font-size: 16px; color: #fff; }
  #controls {
    font-size: 7px;
    color: #888;
    line-height: 1.6;
    text-align: center;
  }
  #controls b { color: #ccc; }
</style>
</head>
<body onclick="window.focus()">

<div id="wrap">
  <h1>PONG42</h1>
  <div id="score"><span id="score-left">0</span><span id="score-right">0</span></div>
  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="overlay">
      <div class="big">PRESS SPACE</div>
      <p>Du spielst gegen den Computer<br>W / S oder &uarr; / &darr; zum Bewegen</p>
    </div>
  </div>
  <div id="controls"><b>DU</b> (links), W / S oder &uarr; / &darr; &nbsp;&nbsp;&nbsp; <b>COMPUTER</b> (rechts)</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardWrap = document.getElementById('board-wrap');
  const overlay = document.getElementById('overlay');
  const scoreLeftEl = document.getElementById('score-left');
  const scoreRightEl = document.getElementById('score-right');

  const ASPECT = 8 / 5; // logical board aspect ratio
  let W, H, PADDLE_W, PADDLE_H, PADDLE_SPEED, BALL_SIZE, AI_SPEED;

  let leftY, rightY;
  let ball, ballVX, ballVY, leftScore = 0, rightScore = 0;
  let running = false, gameOver = false;
  const keys = {};

  function resize() {
    const availW = boardWrap.clientWidth;
    const availH = boardWrap.clientHeight;
    let w = availW, h = w / ASPECT;
    if (h > availH) { h = availH; w = h * ASPECT; }
    canvas.width = Math.floor(w);
    canvas.height = Math.floor(h);
    W = canvas.width;
    H = canvas.height;
    PADDLE_W = H * 0.03;
    PADDLE_H = H * 0.18;
    PADDLE_SPEED = H * 0.016;
    AI_SPEED = PADDLE_SPEED * 0.55;
    BALL_SIZE = H * 0.03;
    if (leftY === undefined) { leftY = H / 2 - PADDLE_H / 2; rightY = H / 2 - PADDLE_H / 2; }
  }

  function resetBall(direction) {
    ball = { x: W / 2 - BALL_SIZE / 2, y: H / 2 - BALL_SIZE / 2 };
    const angle = (Math.random() * 0.6 - 0.3);
    const speed = H * 0.013;
    ballVX = Math.cos(angle) * speed * direction;
    ballVY = Math.sin(angle) * speed;
  }

  function resetGame() {
    leftScore = 0; rightScore = 0;
    scoreLeftEl.textContent = '0';
    scoreRightEl.textContent = '0';
    leftY = rightY = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() < 0.5 ? 1 : -1);
    gameOver = false;
  }

  resize();
  resetGame();
  window.addEventListener('resize', () => {
    resize();
    resetGame();
    showOverlay('PRESS SPACE', 'Du spielst gegen den Computer<br>W / S oder &uarr; / &darr; zum Bewegen');
  });

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      if (!running) {
        if (gameOver) resetGame();
        running = true;
        overlay.classList.add('hidden');
      }
    }
    if (['w','s','W','S','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  });
  document.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function showOverlay(bigText, subText) {
    overlay.querySelector('.big').textContent = bigText;
    overlay.querySelector('p').innerHTML = subText;
    overlay.classList.remove('hidden');
    running = false;
  }

  function update() {
    if (!running) return;

    if (keys['w'] || keys['W'] || keys['ArrowUp']) leftY -= PADDLE_SPEED;
    if (keys['s'] || keys['S'] || keys['ArrowDown']) leftY += PADDLE_SPEED;
    leftY = Math.max(0, Math.min(H - PADDLE_H, leftY));

    // slow computer opponent: tracks the ball with a dead zone and a capped speed
    const aiCenter = rightY + PADDLE_H / 2;
    const targetY = ball.y + BALL_SIZE / 2;
    if (targetY > aiCenter + 6) rightY += AI_SPEED;
    else if (targetY < aiCenter - 6) rightY -= AI_SPEED;
    rightY = Math.max(0, Math.min(H - PADDLE_H, rightY));

    ball.x += ballVX;
    ball.y += ballVY;

    if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
      ballVY *= -1;
      ball.y = Math.max(0, Math.min(H - BALL_SIZE, ball.y));
    }

    // left paddle collision
    if (ball.x <= PADDLE_W + 10 && ball.x >= 10 &&
        ball.y + BALL_SIZE >= leftY && ball.y <= leftY + PADDLE_H && ballVX < 0) {
      const hitPos = (ball.y + BALL_SIZE / 2 - (leftY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ballVX = Math.abs(ballVX) * 1.05;
      ballVY = hitPos * H * 0.014;
      ball.x = PADDLE_W + 10;
    }

    // right paddle (computer) collision
    if (ball.x + BALL_SIZE >= W - PADDLE_W - 10 && ball.x <= W - 10 &&
        ball.y + BALL_SIZE >= rightY && ball.y <= rightY + PADDLE_H && ballVX > 0) {
      const hitPos = (ball.y + BALL_SIZE / 2 - (rightY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ballVX = -Math.abs(ballVX) * 1.05;
      ballVY = hitPos * H * 0.014;
      ball.x = W - PADDLE_W - 10 - BALL_SIZE;
    }

    if (ball.x < -BALL_SIZE) {
      rightScore++;
      scoreRightEl.textContent = rightScore;
      if (rightScore >= 7) { gameOver = true; showOverlay('COMPUTER GEWINNT', 'Leertaste zum Neustart'); return; }
      resetBall(1);
      showOverlay('PUNKT!', 'Leertaste für nächsten Ball');
    } else if (ball.x > W + BALL_SIZE) {
      leftScore++;
      scoreLeftEl.textContent = leftScore;
      if (leftScore >= 7) { gameOver = true; showOverlay('DU GEWINNST!', 'Leertaste zum Neustart'); return; }
      resetBall(-1);
      showOverlay('PUNKT!', 'Leertaste für nächsten Ball');
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#555';
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff';
    ctx.fillRect(10, leftY, PADDLE_W, PADDLE_H);
    ctx.fillRect(W - PADDLE_W - 10, rightY, PADDLE_W, PADDLE_H);
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
