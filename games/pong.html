<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 4px;
    text-shadow: 0 0 8px #fff;
  }
  #score {
    display: flex;
    gap: 80px;
    font-size: 28px;
    text-shadow: 0 0 6px #fff;
  }
  #board-wrap {
    position: relative;
    border: 2px solid #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.25);
  }
  canvas {
    display: block;
    background: #000;
  }
  /* CRT scanline overlay for that old-TV look */
  #board-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,0.8);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay p { font-size: 10px; line-height: 1.8; color: #ccc; }
  #overlay .big { font-size: 16px; color: #fff; }
  #controls {
    display: flex;
    gap: 60px;
    font-size: 9px;
    color: #888;
    line-height: 1.8;
    text-align: center;
  }
  #controls b { color: #ccc; }
  #back {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 9px;
    color: #888;
    text-decoration: none;
    border: 1px solid #444;
    padding: 6px 10px;
  }
  #back:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>

<a id="back" href="javascript:history.back()">&lt; ZURÜCK</a>

<div id="wrap">
  <h1>PONG42</h1>
  <div id="score"><span id="score-left">0</span><span id="score-right">0</span></div>
  <div id="board-wrap">
    <canvas id="board" width="640" height="400"></canvas>
    <div id="overlay">
      <div class="big">PRESS SPACE</div>
      <p>Spieler 1: W / S&nbsp;&nbsp;&nbsp;&nbsp;Spieler 2: &uarr; / &darr;</p>
    </div>
  </div>
  <div id="controls">
    <div><b>SPIELER 1</b><br>W = hoch, S = runter</div>
    <div><b>SPIELER 2</b><br>&uarr; = hoch, &darr; = runter</div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById('overlay');
  const scoreLeftEl = document.getElementById('score-left');
  const scoreRightEl = document.getElementById('score-right');

  const PADDLE_W = 12, PADDLE_H = 70, PADDLE_SPEED = 6;
  const BALL_SIZE = 12;
  const WIN_SCORE = 7;

  let leftY = H / 2 - PADDLE_H / 2;
  let rightY = H / 2 - PADDLE_H / 2;
  let ball, ballVX, ballVY, leftScore = 0, rightScore = 0;
  let running = false, gameOver = false;
  const keys = {};

  function resetBall(direction) {
    ball = { x: W / 2 - BALL_SIZE / 2, y: H / 2 - BALL_SIZE / 2 };
    const angle = (Math.random() * 0.6 - 0.3);
    const speed = 5;
    ballVX = Math.cos(angle) * speed * direction;
    ballVY = Math.sin(angle) * speed;
  }

  function resetGame() {
    leftScore = 0; rightScore = 0;
    scoreLeftEl.textContent = '0';
    scoreRightEl.textContent = '0';
    leftY = rightY = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() < 0.5 ? 1 : -1);
    gameOver = false;
  }

  resetGame();

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      if (!running) {
        if (gameOver) resetGame();
        running = true;
        overlay.classList.add('hidden');
      }
    }
    if (['w','s','W','S','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  });
  document.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function showOverlay(bigText, subText) {
    overlay.querySelector('.big').textContent = bigText;
    overlay.querySelector('p').innerHTML = subText;
    overlay.classList.remove('hidden');
    running = false;
  }

  function update() {
    if (!running) return;

    if (keys['w'] || keys['W']) leftY -= PADDLE_SPEED;
    if (keys['s'] || keys['S']) leftY += PADDLE_SPEED;
    if (keys['ArrowUp']) rightY -= PADDLE_SPEED;
    if (keys['ArrowDown']) rightY += PADDLE_SPEED;
    leftY = Math.max(0, Math.min(H - PADDLE_H, leftY));
    rightY = Math.max(0, Math.min(H - PADDLE_H, rightY));

    ball.x += ballVX;
    ball.y += ballVY;

    if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
      ballVY *= -1;
      ball.y = Math.max(0, Math.min(H - BALL_SIZE, ball.y));
    }

    // left paddle collision
    if (ball.x <= PADDLE_W + 10 && ball.x >= 10 &&
        ball.y + BALL_SIZE >= leftY && ball.y <= leftY + PADDLE_H && ballVX < 0) {
      const hitPos = (ball.y + BALL_SIZE / 2 - (leftY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ballVX = Math.abs(ballVX) * 1.05;
      ballVY = hitPos * 5.5;
      ball.x = PADDLE_W + 10;
    }

    // right paddle collision
    if (ball.x + BALL_SIZE >= W - PADDLE_W - 10 && ball.x <= W - 10 &&
        ball.y + BALL_SIZE >= rightY && ball.y <= rightY + PADDLE_H && ballVX > 0) {
      const hitPos = (ball.y + BALL_SIZE / 2 - (rightY + PADDLE_H / 2)) / (PADDLE_H / 2);
      ballVX = -Math.abs(ballVX) * 1.05;
      ballVY = hitPos * 5.5;
      ball.x = W - PADDLE_W - 10 - BALL_SIZE;
    }

    if (ball.x < -BALL_SIZE) {
      rightScore++;
      scoreRightEl.textContent = rightScore;
      if (rightScore >= WIN_SCORE) { gameOver = true; showOverlay('SPIELER 2 GEWINNT', 'Leertaste zum Neustart'); return; }
      resetBall(1);
      showOverlay('PUNKT!', 'Leertaste für nächsten Ball');
    } else if (ball.x > W + BALL_SIZE) {
      leftScore++;
      scoreLeftEl.textContent = leftScore;
      if (leftScore >= WIN_SCORE) { gameOver = true; showOverlay('SPIELER 1 GEWINNT', 'Leertaste zum Neustart'); return; }
      resetBall(-1);
      showOverlay('PUNKT!', 'Leertaste für nächsten Ball');
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#555';
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff';
    ctx.fillRect(10, leftY, PADDLE_W, PADDLE_H);
    ctx.fillRect(W - PADDLE_W - 10, rightY, PADDLE_W, PADDLE_H);
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
